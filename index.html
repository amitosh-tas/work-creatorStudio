<!doctype html>
<html lang="en" class="scroll-pt-22 bg-canvas motion-safe:scroll-smooth md:scroll-pt-25.5">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn how to create digital products with AI and Canva and sell them on Etsy with Creator Studio’s beginner-friendly course." />
    <link rel="icon" type="image/webp" href="/assets/logo.webp" />
    <title>Creator Studio | Create and Sell Digital Products on Etsy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      customElements.define("hero-count", class extends HTMLElement {
        connectedCallback() {
          const reduced = matchMedia("(prefers-reduced-motion: reduce)")
          if (reduced.matches) return

          const target = Number(this.dataset.value)
          const digits = this.lastElementChild
          const format = new Intl.NumberFormat("en-US")
          digits.textContent = "0"
          let start
          const tick = (now) => {
            if (!this.isConnected) return
            start ??= now
            const t = reduced.matches ? 1 : Math.min((now - start) / 1300, 1)
            const value = Math.floor(target * (1 - (1 - t) ** 2))
            const text = format.format(value)
            if (digits.textContent !== text) digits.textContent = text
            if (t < 1) requestAnimationFrame(tick)
          }
          requestAnimationFrame(tick)
        }
      })

      document.addEventListener("click", (event) => {
        const menu = document.getElementById("mobile-menu")
        if (event.target.closest("[data-mobile-menu-open]")) {
          menu.showModal()
          document.documentElement.classList.add("overflow-hidden")
          menu.addEventListener("close", () => {
            document.documentElement.classList.remove("overflow-hidden")
          }, { once: true })
        } else if (menu?.open && menu.contains(event.target) && event.target.closest("[data-mobile-menu-close], a")) {
          menu.close()
        }
      })

      matchMedia("(min-width: 48rem)").addEventListener("change", (event) => {
        if (event.matches) document.getElementById("mobile-menu")?.close()
      })

      document.addEventListener("click", (event) => {
        const play = event.target.closest("[data-testimonial-play]")
        if (!play || play.hidden || play.hasAttribute("aria-disabled")) return

        const video = play.parentElement.querySelector("video")
        const poster = play.parentElement.querySelector("[data-testimonial-poster]")
        const keyboardActivation = event.detail === 0
        const controller = new AbortController()
        const revealVideo = () => {
          if (controller.signal.aborted) return
          if (keyboardActivation && document.activeElement === play) video.focus({ preventScroll: true })
          poster.hidden = true
          play.hidden = true
        }
        const restorePoster = () => {
          if (controller.signal.aborted) return
          const hadFocus = document.activeElement === video
          controller.abort()
          video.hidden = true
          video.removeAttribute("src")
          video.load()
          poster.hidden = false
          play.hidden = false
          play.removeAttribute("aria-disabled")
          if (hadFocus) play.focus({ preventScroll: true })
        }

        video.addEventListener("error", restorePoster, { once: true, signal: controller.signal })
        video.addEventListener("loadeddata", revealVideo, { once: true, signal: controller.signal })
        play.setAttribute("aria-disabled", "true")
        video.hidden = false
        video.src = video.dataset.src
        video.play().catch((error) => {
          if (error.name === "NotAllowedError") revealVideo()
          else restorePoster()
        })
      })

      if (matchMedia("(prefers-reduced-motion: no-preference)").matches) {
        addEventListener("scroll", () => {
          const motionSource = "/src/landing-motion.js"
          import(motionSource).catch(() => {})
        }, { once: true, passive: true })
      }
    </script>
  </body>
</html>
